
# =============================== M1: environment config =======================#
logs_dir: './Result/LADC_N_AE-MEM-CLS'       # results
data_dir: './datasets/Format'
infer_datafile: ""                    # initialize: get value in commend line via infer_datafile XXXX.csv
prepare_data_dir: ""                  # initialize: get value in DetectOutlier/utils/data.py
simulated_data_dir: ""                # initialize: get value in DetectOutlier/utils/data.py
#logs_dir: 'E:\\code\\PeptideOD\\Result\\Hela_int_all'
#data_dir: 'E:\\code\\PeptideOD\\datasets\\Raw'
Windows_R_USER: 'D:\\program\\Anaconda3\\envs\\ppOD\\Lib\\site-packages\\rpy2'
Linux_R_USER: '/home/server/anaconda3/envs/ppOD/lib/python3.8/site-packages/rpy2'
Linux_R_HOME: '/home/server/anaconda3/envs/ppOD/lib/R'

dataset_list_raw: ['LADC_N.csv']

# =============================== M2: data config =======================#
##### configuration of rescale and resplit data #####
scale_strategy: "log2_qnorm" # std, minmax, "no", qnorm, log2
fill_strategy: global_min # global_min
seed: [42]

data_prepare: true
use_cross_valid: false
seed_nums: 5
##### not used:
joint_data: 'original'
sample_ratio: -1
generate_duplicates: false
input_matrix: "feature_matrix"

# =============================== M3: model config =======================#
models:
  - AdaptiveAE:
      - hidden_neurons: [[128, 32]]
      - hidden_activation: ["relu"]
      - learning_rate: [0.0005]
      - epochs: [100]
      - loss_fn_name: [["MSE", "mem_loss"]]
      - batch_size: [8]
      - contamination: [0.03]
      - use_overfit_dect: [true]
      - window_size: [10]
      - use_hard: [true]
      - mem_momentum: [0.025]
      - pseudo_contamination: [0.3]
      - start_pesudo_epoch: [10]
      - update_epoch: [20]
# =============================== M4: simulated config =======================#
external_outlier_candidates:
#  - Grub: []
  - Grub: ["03N", "92N"]
# =============================== M5: run config =======================#
train_status: true
infer_status: false
save_model: true
visualize_stat: true

