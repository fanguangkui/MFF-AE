dataset_list_raw: ['HCC_P.csv']

# =============================== M2: data config =======================#
##### configuration of rescale and resplit data #####
scale_strategy: "log2_qnorm" # std, minmax, "no", qnorm, log2
fill_strategy: global_min # global_min
seed: [42]

data_prepare: true
TestonAll: true
seed_nums: 5
##### not used:
joint_data: 'original'
sample_ratio: -1
generate_duplicates: false
input_matrix: "feature_matrix"

# =============================== M3: model config =======================#
models:
  - LSCP:
      - contamination: [0.02]
      - random_state: [42]
# =============================== M4: simulated config =======================#
external_outlier_candidates:
  - Grub: ["iBAQ 83", "iBAQ 249", "iBAQ 263", "iBAQ 266"]
  - Biomolecules: ["iBAQ 83", "iBAQ 80", "iBAQ 227", "iBAQ 263", "iBAQ 266", "iBAQ 249"]
# =============================== M5: run config =======================#
train_status: true
infer_status: true
save_model: false
visualize_stat: true

